<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entropi</title>
    <script>
      (() => {
        let mode = "light";
        try {
          const stored = localStorage.getItem("entropi.theme-mode");
          mode = stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        } catch {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <style>
      :root {
        --background: #e8ecf3;
        --accent: #3b82f6;
        background: var(--background);
      }

      :root[data-theme="dark"] {
        --background: #0a0a0a;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 22rem),
          var(--background);
      }

      body {
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: min(680px, 90vw);
        height: auto;
        filter: drop-shadow(0 18px 38px color-mix(in srgb, var(--accent) 24%, transparent));
        animation: splash-float 2.6s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes splash-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.014); }
      }
    </style>
  </head>
  <body>
    <img
      src="/entropi-logo-console-transparent-v2.svg"
      alt="Entropi está iniciando"
      width="680"
      height="220"
    />
    <script type="module" src="/src/splashscreen.ts"></script>
  </body>
</html>
