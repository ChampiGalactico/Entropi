<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const storageKey = "entropi.theme-mode";
        let mode = "light";

        try {
          const storedMode = localStorage.getItem(storageKey);
          mode =
            storedMode === "light" || storedMode === "dark"
              ? storedMode
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <style>
      :root {
        --splash-background: #e8ecf3;
        --splash-surface: rgba(255, 255, 255, 0.68);
        --splash-text: #171717;
        --splash-muted: #737373;
        --splash-accent: #3b82f6;
        background: var(--splash-background);
      }

      :root[data-theme="dark"] {
        --splash-background: #0a0a0a;
        --splash-surface: rgba(36, 38, 45, 0.76);
        --splash-text: #e5e5e5;
        --splash-muted: #737373;
      }

      body {
        margin: 0;
        background: var(--splash-background);
      }

      #entropi-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--splash-text);
        background:
          radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--splash-accent) 12%, transparent), transparent 24rem),
          var(--splash-background);
        opacity: 1;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      #entropi-splash.is-leaving {
        visibility: hidden;
        opacity: 0;
      }

      .entropi-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .entropi-splash__art {
        width: 82px;
        height: 82px;
        filter: drop-shadow(0 16px 30px color-mix(in srgb, var(--splash-accent) 26%, transparent));
      }

      .entropi-splash__orbit {
        transform-origin: 48px 48px;
        animation: entropi-orbit 2.4s linear infinite;
      }

      .entropi-splash__name {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .entropi-splash__progress {
        display: flex;
        gap: 6px;
        height: 8px;
      }

      .entropi-splash__progress span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--splash-accent);
        animation: entropi-pulse 1.2s ease-in-out infinite;
      }

      .entropi-splash__progress span:nth-child(2) { animation-delay: 140ms; }
      .entropi-splash__progress span:nth-child(3) { animation-delay: 280ms; }

      @keyframes entropi-orbit {
        to { transform: rotate(360deg); }
      }

      @keyframes entropi-pulse {
        0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .entropi-splash__orbit,
        .entropi-splash__progress span {
          animation: none;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Entropi</title>
  </head>

  <body>
    <div id="entropi-splash" role="status" aria-label="Cargando Entropi">
      <div class="entropi-splash__content">
        <!-- Replace this placeholder SVG with the final Entropi loading artwork. -->
        <svg class="entropi-splash__art" viewBox="0 0 96 96" aria-hidden="true">
          <defs>
            <linearGradient id="entropi-splash-gradient" x1="16" y1="12" x2="78" y2="84" gradientUnits="userSpaceOnUse">
              <stop stop-color="#60a5fa" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <circle cx="48" cy="48" r="28" fill="url(#entropi-splash-gradient)" />
          <path d="M58 34H39v28h20v-6H46v-5h11v-6H46v-5h12v-6Z" fill="white" />
          <g class="entropi-splash__orbit">
            <circle cx="48" cy="8" r="4" fill="#3b82f6" />
            <circle cx="48" cy="88" r="3" fill="#8b5cf6" />
          </g>
        </svg>
        <p class="entropi-splash__name">Entropi</p>
        <div class="entropi-splash__progress" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
