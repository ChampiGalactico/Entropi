<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const storageKey = "entropi.theme-mode";
        let mode = "light";

        try {
          const storedMode = localStorage.getItem(storageKey);
          mode =
            storedMode === "light" || storedMode === "dark"
              ? storedMode
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <style>
      :root {
        --splash-background: #e8ecf3;
        --splash-text: #171717;
        --splash-accent: #3b82f6;
        background: var(--splash-background);
      }

      :root[data-theme="dark"] {
        --splash-background: #0a0a0a;
        --splash-text: #e5e5e5;
      }

      body {
        margin: 0;
        background: var(--splash-background);
      }

      #entropi-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--splash-text);
        background:
          radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--splash-accent) 12%, transparent), transparent 24rem),
          var(--splash-background);
        opacity: 1;
        pointer-events: none;
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      #entropi-splash.is-leaving {
        visibility: hidden;
        opacity: 0;
      }

      .entropi-splash__content {
        width: min(680px, 88vw);
      }

      .entropi-splash__art {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 18px 38px color-mix(in srgb, var(--splash-accent) 22%, transparent));
        animation: entropi-splash-float 2.6s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes entropi-splash-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-7px) scale(1.012); }
      }

    </style>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Entropi</title>
  </head>

  <body>
    <div id="entropi-splash" role="status" aria-label="Cargando Entropi">
      <div class="entropi-splash__content">
        <img
          class="entropi-splash__art"
          src="/entropi-logo-console-transparent-v2.svg"
          alt=""
          width="680"
          height="220"
        />
      </div>
    </div>
    <script>
      // Safety net: never leave the native window trapped behind the startup
      // artwork if an unexpected frontend error occurs before React mounts.
      window.setTimeout(function () {
        var splash = document.getElementById("entropi-splash");
        if (!splash) return;
        splash.classList.add("is-leaving");
        window.setTimeout(function () { splash.remove(); }, 500);
      }, 6000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
